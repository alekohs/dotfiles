# EXTRA
[signing]
behavior = "own"
backend = "ssh"
key = ""

[git]
sign-on-push = true

# COMMON
[aliases]
describe-from = [
  "util",
  "exec",
  "--",
  "fish",
  "-c",
  '''
  set -l base main
  set -q argv[2]; and set base $argv[2]
  jj describe -m (jj log -r "$base..$argv[1]" --reversed --no-graph -T 'if(description, "- " ++ description.first_line() ++ "\n")' | string collect)
  ''',
]
bl = ["bookmark", "list"]
bc = ["bookmark", "create"]
bd = ["bookmark", "delete"]

tug = ["bookmark", "move", "--from", "closest_bookmark(@-)", "--to", "@-"]
tugn = ["bookmark", "move", "--from", "closest_bookmark(@-)", "--to", "@"]

mine = ["bookmark", "list", "-r", "mine()"]

udiff = ["diff", "--config", "ui.diff-formatter=:color-words"]
diff-summary = ["diff", "--summary", "--no-pager"]
diff-files = ["diff", "--name-only", "--no-pager"]
idiff = ["diff", "--tool", "difft-inline"]

l = ["log", "-r", "stack()"]
ls = ["log", "-r", "stack()", "--summary"]
la = ["log", "-r", "all()"]
ll = ["log", "-T", "builtin_log_detailed"]
lls = ["log", "-T", "builtin_log_detailed", "--summary"]
lr = ["log", "-r", "remote_bookmarks()"]
o = ["log", "-r", "open()"]

nt = ["new", "trunk()"]
retrunk = [
  "rebase",
  "-d",
  "trunk()",
] # rebase the current branch onto the trunk.

# git commands
f = ["git", "fetch"]
p = ["git", "push"]
pc = [
  "git",
  "push",
  "--change",
  "@-",
] # push current cahnges and auto naming the bookmark

# workspaces
w = ["workspace"]
wa = ["workspace", "add"]
wf = ["workspace", "forget"]
wl = ["workspace", "list"]

oplog = ["op", "log"]

[revset-aliases]
"closest_bookmark(to)" = "heads(::to & bookmarks())"
"fork_history(to, from)" = "fork_point(to | from)..@"
"stack()" = "stack(@)"
"stack(x)" = "ancestors(reachable(x, mutable()), 2)"  # your current branch, root to tip
"open()" = "trunk()..mine() & mutable()"              # everything you haven't landed
"wip()" = "open() & ~empty()"

[template-aliases]
"format_timestamp(timestamp)" = "timestamp.ago()"

[ui]
diff-formatter = [
  "difft",
  "--color=always",
  "--width=$width",
  "$left",
  "$right",
]
merge-editor = "nvimdiff3"

[merge-tools.nvimdiff3]
program = "nvim"
merge-args = [
  "--cmd",
  "let g:nvim_merge = 1",
  "-d",
  "$output",
  "-M",
  "$left",
  "$base",
  "$right",
  "-c",
  "lua require('config.merge').setup()",
]
merge-tool-edits-conflict-markers = true
conflict-marker-style = "git"

[merge-tools.difft-inline]
program = "difft"
diff-args = [
  "--color=always",
  "--display=inline",
  "--width=$width",
  "$left",
  "$right",
]

[lazyjj]
highlight-color = "black"
